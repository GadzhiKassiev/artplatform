schema:
  - ./api/graphql/auth.graphqls
  - ./api/graphql/course.graphqls

exec:
  filename: api/graphql/generated/generated.go
  package: generated

model:
  filename: api/graphql/generated/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: api/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

autobind:

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
  Float:
    model:
      - github.com/99designs/gqlgen/graphql.Float