syntax = "proto3";

package activity;

option go_package = "artplatform/backend/proto/activity";

import "buf/validate/validate.proto";

service ActivityService {
  rpc GetCourseStats(GetCourseStatsRequest) returns (CourseStatsResponse);
  rpc RecordView(RecordViewRequest) returns (RecordViewResponse);
}

message CourseStats {
  string course_id = 1;
  int64 view_count = 2;
  int64 purchase_count = 3;
}

message GetCourseStatsRequest {
  string course_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RecordViewRequest {
  string course_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RecordViewResponse {
  bool success = 1;
}

message CourseStatsResponse {
  CourseStats stats = 1;
}