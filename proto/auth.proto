syntax = "proto3";

package auth;

option go_package = "artplatform/backend/proto/auth";

import "buf/validate/validate.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message RegisterRequest {
  string email    = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 6];
  string role     = 3 [(buf.validate.field).string = {
    in: ["STUDENT", "TEACHER"]
  }];
}

message RegisterResponse {
  string user_id = 1;
  string token = 2;
}

message LoginRequest {
  string email    = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string user_id = 1;
  string token = 2;
}

message ValidateTokenRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

message ValidateTokenResponse {
  string user_id = 1;
  string role = 2;
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string role = 3;
}